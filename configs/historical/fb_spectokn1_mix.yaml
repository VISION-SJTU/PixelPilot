### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 720000
# video_max_pixels: 16384

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: nusc_2d_fb_train_percep_action_spectokns1_mix
template: qwen2_vl
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 32

### output
output_dir: saves/spectokn/qwen25_vl-7b_nusc_2d_fb_down2x_spetokns1NotAdd_mix_0916/full/sft
logging_steps: 10
save_steps: 2000
plot_loss: true
overwrite_output_dir: false


### train
per_device_eval_batch_size: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-06
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
eval_steps: 100
eval_strategy: 'no'
val_size: 0.01

