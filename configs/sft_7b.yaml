# Recovered from fb_spectokn1_mix_p_a_t_pat.yaml in the supplied 0.9.4.dev0 snapshot.
# Paths, dataset registration and console-only reporting adapted for this release.
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 720000
stage: sft
do_train: true
finetuning_type: full
deepspeed: configs/deepspeed/zero3.json
dataset: pixelpilot_train
dataset_dir: data/nuscenes_sft
template: qwen2_vl
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 32
output_dir: checkpoints/pixelpilot-7b-sft
logging_steps: 10
save_steps: 1000
plot_loss: true
overwrite_output_dir: false
per_device_eval_batch_size: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
eval_steps: 100
eval_strategy: 'no'
val_size: 0.01
report_to: none
use_swanlab: false
